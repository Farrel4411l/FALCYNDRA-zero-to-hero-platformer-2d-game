<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Falcyndra - Zero to Hero</title>
    <style>
        body {
            margin: 0; padding: 0; background-color: #050505; color: white;
            font-family: 'Segoe UI', sans-serif; overflow: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;
        }
        #game-container { position: relative; }
        canvas {
            background-color: #1a1a2e;
            border: 2px solid #333;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
            border-radius: 5px;
        }
        #ui-layer {
            position: absolute; top: 10px; left: 10px; pointer-events: none;
            display: flex; justify-content: space-between; width: 920px;
        }
        .ui-box {
            background: rgba(10, 20, 30, 0.85);
            padding: 10px 15px; border-radius: 8px; border: 2px solid #2c3e50;
            font-size: 14px; line-height: 1.5; color: #ecf0f1;
            text-shadow: 1px 1px 2px black;
        }
        #msg-box { position:absolute; top: 80px; width:100%; text-align:center; color: #f1c40f; font-weight: bold; font-size: 20px; text-shadow: 2px 2px 4px black;}
        
        #lvlup-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); display: none; flex-direction: column;
            align-items: center; justify-content: center; z-index: 10;
        }
        .lvl-panel {
            background: #2c3e50; padding: 30px; border-radius: 10px; border: 3px solid #f1c40f;
            text-align: center;
        }
        .lvl-panel h2 { color: #f1c40f; margin-top:0;}
        .stat-btn {
            background: #34495e; color: white; border: 2px solid #7f8c8d;
            padding: 10px 20px; margin: 10px; cursor: pointer; font-size: 16px; border-radius: 5px;
        }
        .stat-btn:hover { background: #3498db; }
        .xp-bar-bg { width: 100%; height: 10px; background: #555; margin-top: 5px; border-radius: 5px; }
        .xp-bar-fill { height: 100%; background: #9b59b6; width: 0%; border-radius: 5px; transition: width 0.3s; }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="960" height="540"></canvas>
        <div id="ui-layer">
            <div class="ui-box" id="playerStats">Loading...</div>
            <div class="ui-box" id="levelInfo">Lobby</div>
        </div>
        <div id="msg-box"></div>
        
        <!-- UI Level Up -->
        <div id="lvlup-overlay">
            <div class="lvl-panel">
                <h2>LEVEL UP!</h2>
                <p>Pilih Stat untuk dinaikkan:</p>
                <button class="stat-btn" onclick="player.addStat('STR')">Tekan [1] - STR (+5 Physical)</button>
                <button class="stat-btn" onclick="player.addStat('INT')">Tekan [2] - INT (+5 Magical)</button>
                <button class="stat-btn" onclick="player.addStat('AGI')">Tekan [3] - AGI (+Speed & Lompat)</button>
            </div>
        </div>
        
        <!-- Panduan Kontrol -->
        <div style="position:absolute; bottom:15px; width:100%; text-align:center; color:#bdc3c7; font-size:14px; text-shadow:1px 1px 2px black; pointer-events:none;">
            <b>KONTROL:</b> [A/D] Gerak | [W] Lompat | <b style="color:#f1c40f;">[SPASI] Serang</b> | [Q] Ganti Senjata | [E] Masuk Portal
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
